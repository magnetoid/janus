# CI for janus-agent — the substrate every self-modification gate depends on.
#
# Referenced (but previously absent) by scripts/run_tests_parallel.py and the
# self-improvement docs; added as Track 1 Phase 0.1 of
# docs/self-improvement-evaluation-2026.md (gap G2).
#
# Actions are pinned to full commit SHAs per the repo dependency-pinning
# policy (AGENTS.md "Dependency Pinning Policy", post-litellm / Shai-Hulud).
#
# Gating model — this repo had NO CI, so the full suite has a large
# pre-existing baseline of "passes on a dev box, fails in a clean env"
# failures (dashboard/gateway/service/model-picker/LSP/…), all reproducible
# on `main` before this workflow existed. Rather than a permanently-red
# required check (which trains everyone to ignore CI), the gate is staged:
#   * lint          — HARD gate (ruff policy + Windows footgun scan)
#   * tests-changed — HARD gate: the learning-store + cache tests this track
#                     owns; keeps the self-improvement substrate honest now.
#   * tests-full    — INFORMATIONAL (continue-on-error): runs the whole suite
#                     so the baseline is visible and shrinkable, not blocking.
# Flip tests-full to a hard gate once the baseline reaches zero.
#
# Deliberately NOT here yet: `janus evals gate --fail-closed` (needs
# execution-based checks + a persistent trend store) and `ty check` (~9.4k
# diagnostics today — a red job people learn to ignore).

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - name: Install (dev extras)
        run: |
          uv venv .venv --python 3.11
          uv pip install -e ".[dev]" --python .venv/bin/python
      - name: ruff (PLW1514 repo-wide policy)
        run: .venv/bin/ruff check .
      - name: Windows cross-platform footguns
        run: .venv/bin/python scripts/check-windows-footguns.py --all

  tests-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - name: Install (full extras + dev)
        run: |
          uv venv .venv --python 3.11
          uv pip install -e ".[all,dev]" --python .venv/bin/python
      # The learning-store locking + cache-prefix invariant this track owns,
      # plus the existing tests for the modules it touched. HARD gate.
      - name: Owned tests
        run: |
          scripts/run_tests.sh \
            tests/agent/test_learning_store_locking.py \
            tests/run_agent/test_cache_prefix_byte_stability.py \
            tests/agent/test_lessons.py \
            tests/agent/test_outcome_tracker.py \
            tests/agent/test_model_strengths.py \
            tests/agent/test_auto_mine.py \
            tests/agent/test_sleep.py

  tests-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # INFORMATIONAL until the pre-existing baseline is driven to zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.11"
      - name: Install (full extras + dev)
        # .[all,dev] matches the canonical dev install (CLAUDE.md): the suite
        # imports optional deps (agent-client-protocol, numpy, …) only the
        # `all` meta-extra pulls in; a dev-only install fails collection.
        run: |
          uv venv .venv --python 3.11
          uv pip install -e ".[all,dev]" --python .venv/bin/python
      # scripts/run_tests.sh is the ONLY sanctioned runner: hermetic env
      # (env -i, TZ=UTC, credentials blanked), one subprocess per test file.
      # tests/{integration,e2e,docker} are excluded by its default discovery.
      - name: Full suite (baseline visibility)
        run: scripts/run_tests.sh
